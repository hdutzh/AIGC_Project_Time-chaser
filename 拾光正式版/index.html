<aside class="sidebar">

      <strong>拾光</strong>
      <small>STUDY FLOW</small>
    </span>
  </a>
  <div class="nav-label">你的工作台</div>
  <nav class="side-nav" aria-label="主导航">
    <a class="nav-item" href="#today" data-nav="today">

    </a>
    <a class="nav-item" href="#tasks" data-nav="tasks">
      <span class="nav-icon"><svg class="ico"><use href="#i-list"></use></svg></span>
      <span>任务</span>
      <span class="nav-badge hidden" data-badge="tasks"></span>
    </a>
    <a class="nav-item" href="#calendar" data-nav="calendar">
      <span class="nav-icon"><svg class="ico"><use href="#i-calendar"></use></svg></span>
      <span>日历</span>
    </a>
    <a class="nav-item" href="#messages" data-nav="messages">
      <span class="nav-icon"><svg class="ico"><use href="#i-inbox"></use></svg></span>
      <span>消息</span>
      <span class="nav-badge hidden" data-badge="messages"></span>
    </a>
    <a class="nav-item" href="#settings" data-nav="settings">
      <span class="nav-icon"><svg class="ico"><use href="#i-chart"></use></svg></span>
      <span>统计 · 设置</span>
    </a>
  </nav>
  <div class="side-bottom">
    <div class="side-progress-card">
      <div class="side-progress-top">
        <span>今日完成</span>

      <p id="side-progress-text">把重要的事放进今天。</p>
    </div>
